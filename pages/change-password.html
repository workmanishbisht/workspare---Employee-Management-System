<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password | Employee Management System</title>

    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/profile.css" />
    <link rel="stylesheet" href="../css/change-password.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <!-- ============ SIDEBAR ============ -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <div class="brand__icon"><i class="ri-team-fill"></i></div>
          <div class="brand__text">
            <h1>Workspare</h1>
            <p>Employee Management System</p>
          </div>
        </div>

        <nav class="sidebar__nav">
          <ul id="navList">
            <!-- injected by JS -->
          </ul>
        </nav>

        <div class="sidebar__upgrade">
          <div class="upgrade__icon"><i class="ri-vip-crown-2-fill"></i></div>
          <p class="upgrade__title">Upgrade to Pro</p>
          <p class="upgrade__sub">Unlock more features</p>
          <button class="btn btn--primary btn--block">Upgrade Now</button>
        </div>

        <div class="sidebar__user-wrap">
          <button
            class="sidebar__user"
            id="userMenuTrigger"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="userMenu"
          >
            <img
              src="https://i.pravatar.cc/80?img=13"
              alt="User avatar"
              class="user__avatar"
              id="sidebarAvatar"
            />
            <div class="user__info">
              <p class="user__name" id="sidebarUserName">Loading…</p>
              <p class="user__role" id="sidebarUserRole">—</p>
            </div>
            <i class="ri-arrow-down-s-line user__chevron"></i>
          </button>

          <ul class="user-menu" id="userMenu" role="menu">
            <li role="none">
              <button
                role="menuitem"
                class="user-menu__item"
                data-action="profile"
              >
                <i class="ri-user-3-line"></i>
                <span>View Profile</span>
              </button>
            </li>
            <li role="none">
              <button
                role="menuitem"
                class="user-menu__item"
                data-action="password"
              >
                <i class="ri-lock-password-line"></i>
                <span>Change Password</span>
              </button>
            </li>
            <li role="none">
              <button
                role="menuitem"
                class="user-menu__item"
                data-action="help"
              >
                <i class="ri-question-line"></i>
                <span>Help Center</span>
              </button>
            </li>
            <li class="user-menu__divider" role="separator"></li>
            <li role="none">
              <button
                role="menuitem"
                class="user-menu__item user-menu__item--danger"
                data-action="logout"
              >
                <i class="ri-logout-box-r-line" style="color: #cf2626"></i>
                <span style="color: #cf2626">Logout</span>
              </button>
            </li>
          </ul>
        </div>
      </aside>

      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <!-- ============ MAIN ============ -->
      <div class="main">
        <header class="topbar">
          <button
            class="icon-btn topbar__menu"
            id="menuToggle"
            aria-label="Toggle menu"
          >
            <i class="ri-menu-line"></i>
          </button>

          <div class="search-box">
            <i class="ri-search-line"></i>
            <input type="text" placeholder="Search anything..." />
            <kbd>⌘ K</kbd>
          </div>

          <div class="topbar__right">
            <button
              id="themeToggle"
              class="theme-toggle"
              type="button"
              aria-label="Toggle Theme"
            >
              <span id="themeToggleLight" class="theme-toggle__option">
                <i class="ri-sun-line"></i>
              </span>
              <span id="themeToggleDark" class="theme-toggle__option">
                <i class="ri-moon-line"></i>
              </span>
            </button>
            <button class="icon-btn has-badge" aria-label="Notifications">
              <i class="ri-notification-3-line"></i>
              <span class="badge">3</span>
            </button>
            <img
              src="https://i.pravatar.cc/80?img=13"
              class="topbar__avatar"
              id="topbarAvatar"
              alt="User avatar"
            />
          </div>
        </header>

        <main class="content">
          <div class="page-head">
            <div>
              <a href="./profile.html" class="back-link">
                <i class="ri-arrow-left-line"></i>
                <span>Back to Profile</span>
              </a>
              <h2>Change Password</h2>
              <p>Update your account password securely.</p>
            </div>
          </div>

          <div class="password-layout">
            <section class="card password-card">
              <form id="changePasswordForm" novalidate>
                <!-- Current password -->
                <label class="form-field password-field">
                  <span>Current Password</span>
                  <div class="password-input-wrap">
                    <input
                      type="password"
                      id="currentPassword"
                      name="currentPassword"
                      placeholder="Enter your current password"
                      autocomplete="current-password"
                      required
                    />
                    <button
                      type="button"
                      class="password-toggle-btn"
                      data-target="currentPassword"
                      aria-label="Show password"
                    >
                      <i class="ri-eye-line"></i>
                    </button>
                  </div>
                </label>

                <!-- New password -->
                <label class="form-field password-field">
                  <span>New Password</span>
                  <div class="password-input-wrap">
                    <input
                      type="password"
                      id="newPassword"
                      name="newPassword"
                      placeholder="Enter a new password"
                      autocomplete="new-password"
                      required
                    />
                    <button
                      type="button"
                      class="password-toggle-btn"
                      data-target="newPassword"
                      aria-label="Show password"
                    >
                      <i class="ri-eye-line"></i>
                    </button>
                  </div>
                </label>

                <!-- Strength meter -->
                <div class="strength-meter" id="strengthMeter">
                  <div class="strength-meter__track">
                    <div class="strength-meter__fill" id="strengthFill"></div>
                  </div>
                  <span class="strength-meter__label">
                    Strength: <strong id="strengthLabel">—</strong>
                  </span>
                </div>

                <!-- Confirm password -->
                <label class="form-field password-field">
                  <span>Confirm New Password</span>
                  <div class="password-input-wrap">
                    <input
                      type="password"
                      id="confirmPassword"
                      name="confirmPassword"
                      placeholder="Re-enter the new password"
                      autocomplete="new-password"
                      required
                    />
                    <button
                      type="button"
                      class="password-toggle-btn"
                      data-target="confirmPassword"
                      aria-label="Show password"
                    >
                      <i class="ri-eye-line"></i>
                    </button>
                  </div>
                  <span class="field-error" id="confirmError"></span>
                </label>

                <!-- Requirements checklist -->
                <div class="requirements-card">
                  <p class="requirements-card__title">Password Requirements</p>
                  <ul class="requirements-list" id="requirementsList">
                    <li data-req="length">
                      <i class="ri-checkbox-blank-circle-line"></i> Minimum 8
                      characters
                    </li>
                    <li data-req="uppercase">
                      <i class="ri-checkbox-blank-circle-line"></i> Uppercase
                      letter
                    </li>
                    <li data-req="number">
                      <i class="ri-checkbox-blank-circle-line"></i> Number
                    </li>
                    <li data-req="special">
                      <i class="ri-checkbox-blank-circle-line"></i> Special
                      character
                    </li>
                  </ul>
                </div>

                <div class="password-card__actions">
                  <button
                    type="button"
                    class="btn btn--ghost"
                    id="cancelPasswordBtn"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    class="btn btn--primary"
                    id="updatePasswordBtn"
                  >
                    <i class="ri-shield-check-line"></i>
                    Update Password
                  </button>
                </div>
              </form>
            </section>
          </div>
        </main>
      </div>
    </div>

    <!-- script file link -->
    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/change-password.js"></script>
    <script src="../js/theme.js"></script>
  </body>
</html>
